name: Validate and deploy MkDocs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch current pull-request head
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull-request number" >&2
            exit 1
          fi
          remote_ref="refs/pull/${PR_NUMBER}/head"
          if ! remote_ref_line="$(git ls-remote --refs origin "${remote_ref}")"; then
            echo "Unable to inspect current pull-request head" >&2
            exit 1
          fi
          if [[ -z "${remote_ref_line}" ]]; then
            echo "Current pull-request head is missing" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+${remote_ref}:refs/remotes/pull/${PR_NUMBER}/head"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-audit-bootstrap.lock
            requirements-audit.lock
      - name: Scan release-reachable and current pull-request history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          ignore_path="${RUNNER_TEMP}/gitleaks-empty-ignore"
          : > "${ignore_path}"
          python scripts/test_gitleaks_controls.py \
            --gitleaks "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" git --log-opts='--all --text -m' --redact \
            --ignore-gitleaks-allow --gitleaks-ignore-path "${ignore_path}" \
            --no-banner .
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Audit locked runtime dependencies
        run: |
          AUDIT_VENV="${RUNNER_TEMP}/ai-books-audit-venv"
          python -m venv "${AUDIT_VENV}"
          "${AUDIT_VENV}/bin/python" -m pip install --no-cache-dir \
            --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes --requirement requirements-audit-bootstrap.lock
          "${AUDIT_VENV}/bin/python" -m pip install --no-cache-dir \
            --disable-pip-version-check --require-hashes --no-build-isolation \
            --requirement requirements-audit.lock
          "${AUDIT_VENV}/bin/python" -m pip_audit --strict --progress-spinner off --require-hashes --disable-pip --requirement requirements.lock
          "${AUDIT_VENV}/bin/python" -m pip_audit --strict --progress-spinner off --require-hashes --disable-pip --requirement requirements-audit.lock
          "${AUDIT_VENV}/bin/python" -m pip_audit --strict --progress-spinner off --require-hashes --disable-pip --requirement requirements-audit-bootstrap.lock
          "${AUDIT_VENV}/bin/cffconvert" --validate --infile CITATION.cff
          "${AUDIT_VENV}/bin/python" scripts/verify_sbom_schema.py
      - name: Run source, rights, safety, and structural gates
        run: |
          python scripts/originality_scan.py
          python scripts/check_figure_coverage.py
          python scripts/build_asset_rights_register.py --check
          python scripts/build_asset_manifest.py --check
          python scripts/check_publication_safety.py
          python scripts/test_release_gates.py
          python scripts/verify_math_examples.py
          python scripts/test_ebook_site.py .
          node scripts/test_mathjax_fallback.mjs
          node scripts/verify_mathjax_integrity.mjs
      - name: Build and validate rendered site
        run: |
          mkdocs build --strict --clean
          python scripts/postprocess_site.py --site-dir site
          python scripts/validate_rendered_site.py --site-dir site --expected-release-sha "${GITHUB_SHA}"
          python scripts/check_publication_safety.py --site-dir site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy exact validated artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact revision for live verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify live page exposes the deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          response="${RUNNER_TEMP}/live-page.html"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${PAGE_URL}?release-revision=${GITHUB_SHA}&attempt=${attempt}" \
              --output "${response}"; then
              if python scripts/verify_release_marker.py \
                --html-file "${response}" \
                --expected-release-sha "${GITHUB_SHA}"; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "LIVE_REVISION_ERROR expected ${GITHUB_SHA} at ${PAGE_URL}" >&2
          exit 1
